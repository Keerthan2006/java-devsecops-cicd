apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-deploy
  namespace: application
  labels:
    app: java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-maven-app
        image: "{{ .Values.image.username }}/java-app-deploy:{{ .Values.image.tag }}"
        ports:
        - containerPort: 9090
