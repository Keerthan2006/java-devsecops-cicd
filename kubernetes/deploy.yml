apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-deploy
  namespace: application
  labels:
    app: java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-maven-app
        image: keerthan04/java-app-deploy:2cb96fd0c3ce2752188f1f32669f5784d4819ad8
        ports:
        - containerPort: 9090
