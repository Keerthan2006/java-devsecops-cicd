apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: java-sec-app
  namespace: argocd
spec:
  destination:
    namespace: application
    server: https://kubernetes.default.svc
  source:
    path: java-app
    repoURL: https://github.com/Keerthan2006/java-devsecops-cicd
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true

